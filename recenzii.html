<!DOCTYPE html>

<body>

<section class="reviews-page">

    <h1>Toate recenziile</h1>

    <div class="reviews-info">

        <h2 id="ratingAverage">⭐ 5.0</h2>

    <input
        type="text"
        id="searchReview"
        placeholder="Caută după nume..."

    <div id="reviewsGrid" class="reviews-grid"></div>

    <div class="pagination">

        <button id="prevPage">← Înapoi</button>

        <span id="pageNumber">1</span>

        <button id="nextPage">Înainte →</button>

    </div>

</section>

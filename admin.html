<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panou Administrare - Marian IT</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body{
            background:#f5f7fb;
            font-family:Arial,Helvetica,sans-serif;
            margin:0;
        }

        header{

            background:#0f172a;
            color:white;

            padding:20px 40px;

            display:flex;
            justify-content:space-between;
            align-items:center;

        }

        .container{

            width:90%;
            max-width:1200px;

            margin:40px auto;

        }

        .cards{

            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;

        }

        .card{

            background:white;

            border-radius:15px;

            padding:25px;

            box-shadow:0 8px 25px rgba(0,0,0,.08);

        }

        .card h2{

            margin:0;
            font-size:35px;

        }

        .card p{

            color:#666;

        }

        table{

            width:100%;

            background:white;

            border-radius:15px;

            margin-top:35px;

            border-collapse:collapse;

            overflow:hidden;

        }

        th,td{

            padding:16px;

            border-bottom:1px solid #eee;

        }

        th{

            background:#0f172a;

            color:white;

        }

        .delete{

            background:#dc2626;

            color:white;

            border:none;

            padding:8px 16px;

            border-radius:8px;

            cursor:pointer;

        }

    </style>

</head>

<body>

<header>

<h1>Marian IT - Admin</h1>

<button id="logoutBtn">
Logout
</button>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h2 id="totalReviews">0</h2>

<p>Recenzii</p>

</div>

<div class="card">

<h2 id="averageStars">0.0</h2>

<p>Media Stelelor</p>

</div>

</div>

<h2 style="margin-top:45px">
Ultimele recenzii
</h2>

<table>

<thead>

<tr>

<th>Nume</th>

<th>Stele</th>

<th>Recenzie</th>

<th>Acțiune</th>

</tr>

</thead>

<tbody id="reviewsTable">

</tbody>

</table>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
